<div class="auth-wrapper">
  <div class="auth-ambient-glow"></div>

  <div class="auth-box">
    <div class="auth-brand-logo">
      <span class="auth-logo-badge">🎬</span>
      <h2>Cine<span class="brand-gradient">Pass</span></h2>
      <p>Welcome back! Sign in to book your favorite shows.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form-body">
      <div class="form-group-custom">
        <label for="email">Email Address</label>
        <div class="input-with-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="field-icon">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            class="custom-cinema-input"
            [class.input-error]="form.get('email')?.invalid && form.get('email')?.touched"
          />
        </div>
        <div class="field-error-hint" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Please enter a valid email address.
        </div>
      </div>

      <div class="form-group-custom">
        <label for="password">Password</label>
        <div class="input-with-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="field-icon">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••"
            class="custom-cinema-input"
            [class.input-error]="form.get('password')?.invalid && form.get('password')?.touched"
          />
        </div>
        <div class="field-error-hint" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          Password is required.
        </div>
      </div>

      <div class="cinema-alert error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn btn-glow-primary btn-block btn-lg" [disabled]="loading || form.invalid">
        <span *ngIf="!loading">Sign In to Account</span>
        <span *ngIf="loading">Authenticating...</span>
      </button>
    </form>

    <div class="auth-bottom-switch">
      <span>Don't have an account yet?</span>
      <a routerLink="/register" class="switch-link">Create Account</a>
    </div>
  </div>
</div>
